<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Đăng ký – Cầu lông</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="auth" style="--bg:url('https://images.pexels.com/photos/8007094/pexels-photo-8007094.jpeg?auto=compress&amp;cs=tinysrgb&amp;w=1600')">
    <div class="auth-brand"><span>🏸</span>Cầu lông</div>

    <div class="auth-intro">
      <h1>Vào sân cùng chúng tôi và bắt đầu trận đấu đầu tiên.</h1>
      <a class="pill" href="./login.html">Tôi đã có tài khoản</a>
      <p>Tạo tài khoản miễn phí chỉ trong một phút để khám phá môn cầu lông.</p>
    </div>

    <main class="auth-card">
      <h2>🏸 Đăng ký</h2>
      <p class="sub">Điền thông tin bên dưới để tạo tài khoản.</p>

      <form id="register-form">
        <label>Tài khoản
          <input type="text" id="username" placeholder="Ít nhất 6 ký tự" autocomplete="username" required>
        </label>
        <label>Email
          <input type="email" id="email" placeholder="ban@example.com" autocomplete="email" required>
        </label>
        <label>Mật khẩu
          <input type="password" id="password" placeholder="Nhập mật khẩu" autocomplete="new-password" required>
          <span class="hint">Ít nhất 8 ký tự, gồm chữ hoa, chữ thường và số</span>
        </label>
        <button class="btn" type="submit">Tạo tài khoản</button>
      </form>
    </main>
  </div>
  <script src="../java/register.js"></script>
</body>
</html>
